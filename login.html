<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b1512">
  <title>Acceso · Centro Deportivo Estrella</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth-page">
    <section class="auth-card">
      <h1>Acceso</h1>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true" data-mode="login">Iniciar sesión</button>
        <button class="tab" role="tab" aria-selected="false" data-mode="register">Crear cuenta</button>
      </div>
      <form id="authForm" novalidate>
        <label id="nameField" class="hidden">Nombre<input name="nombre" autocomplete="name"></label>
        <label>Correo<input name="correo" type="email" autocomplete="email" required></label>
        <div class="field">
          <label for="clave">Contraseña</label>
          <div class="pass-wrap">
            <input id="clave" name="clave" type="password" autocomplete="current-password" required>
            <button type="button" class="eye" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg>
            </button>
          </div>
        </div>
        <div class="field hidden" id="confirmField">
          <label for="clave2">Repite la contraseña</label>
          <div class="pass-wrap">
            <input id="clave2" name="clave2" type="password" autocomplete="new-password">
            <button type="button" class="eye" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg>
            </button>
          </div>
        </div>
        <button class="btn" type="submit" id="submitBtn">Iniciar sesión</button>
        <p class="form-msg" id="authMsg" aria-live="polite"></p>
      </form>
      <a class="back" href="index.html">Volver al inicio</a>
    </section>
  </div>
  <script src="auth.js"></script>
</body>
</html>
